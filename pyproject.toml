[build-system]
requires = ["setuptools>=78.1.1,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-ci-shared"
version = "1.17.0"  # the next release tag without its "v"; tests/test_release_version.py ties it to __version__ and the tags
description = "Shared CI/lint tooling (scripts + ruff base config + reusable GitHub Actions workflows) for fingoldo Python projects."
authors = [{name = "Anatoly Alexeev", email = "fingoldo@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
# Deliberately dependency-free for the dev-tool orchestration scripts (black/ruff/mypy/bandit/
# vulture/codespell/pip-audit are installed by the CALLING project's own CI/pre-commit setup, or
# run via `uvx`). Baselines are read and written with the stdlib json module through _core.
# ``tomllib`` is stdlib only from 3.11, and this package supports 3.9 upward: five checkers read a
# pyproject.toml, so on 3.9/3.10 they need the parser tomllib was adopted from.
# PyYAML is a runtime dependency, found the hard way: CI's test job on all three
# runners failed with ModuleNotFoundError: No module named 'yaml' (2026-09-12, 14 failed / 1480
# passed). `gate_config_honesty`, `gate_integrity` and `ignore_ratchet` each parse a pre-commit
# config or a workflow with an unconditional `import yaml`, so a consumer that does not already
# happen to have it gets an import error from the check instead of a finding.
dependencies = ["tomli>=2.0; python_version < '3.11'", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    # timezone_honest runs `python -m ruff`, so its tests need ruff in the test environment; without
    # it CI's test job had none and every one of them failed. Exact, equal to tool_versions.RUFF_VERSION
    # (tests/test_pinned_tool_versions.py holds the two together).
    "ruff==0.16.1",
    # config_call_site_parity.py's tests build a real pydantic.BaseModel schema fixture (the
    # module itself is duck-typed, no pydantic import at runtime -- only the tests need a
    # concrete model class to exercise it against).
    "pydantic>=2.0",
    # env_example_round_trip.py's tests build real pydantic-settings classes, one with the NoDecode
    # annotation the fixed shape needs (added in 2.7). The module itself imports neither pydantic package.
    "pydantic-settings>=2.7",
    # code_audit_meta.py wraps pyutilz.dev.code_audit.run_all() -- exercising it for real (not
    # mocked) needs pyutilz itself. Not on PyPI, so git+https like every consuming repo's own CI.
    # Pinned to a full commit SHA (found unpinned by this repo's own git_dependency_pins check,
    # 2026-07-22 -- the original regex required an '@ref' to even attempt a match, so a bare
    # `git+URL` with no ref at all sailed through undetected).
    "pyutilz @ git+https://github.com/fingoldo/pyutilz.git@3be55c1512ad73a6dab628b4a79eeecbc31212a1",
    # Each of these is imported by some test through importorskip; without them in the extra those tests skipped in CI
    # and the modules they cover (safe_precommit, hash_fed_by_array_copy, statement_compilation, the tomli fallback)
    # were never exercised.
    "pre-commit>=3.0",
    "numpy>=1.22",
    "sqlalchemy>=2.0",
    "tomli>=2.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.2",
]

[project.scripts]
safe-precommit = "py_ci_shared.safe_precommit:main"
py-ci-install-safe-hook = "py_ci_shared.install_safe_hook:main"
py-ci-setup-env = "py_ci_shared.setup_env:main"
# One entry point for every gate and tool: run/run-all/refresh/list/config-path/tool (see README "Command line").
py-ci-shared = "py_ci_shared.cli:main"

# Opt-in: the plugin does nothing until the repo's pyproject.toml has a [tool.py_ci_shared] table.
[project.entry-points.pytest11]
py_ci_shared = "py_ci_shared.pytest_plugin"

[project.urls]
Repository = "https://github.com/fingoldo/py-ci-shared"

[tool.setuptools.packages.find]
where = ["src"]

# The ruff configs ship as package data too, so an installed package can point ruff's `extend` at them:
# `py-ci-shared config-path ruff-base` prints the path. configs/ at the repo root stays the copy consumers reach through
# PY_CI_SHARED_DIR; tests/test_package_inventory.py keeps the two byte-identical.
[tool.setuptools.package-data]
py_ci_shared = ["configs/*.toml", "registry.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
# A hung git or python child fails its test after this long instead of holding the job to its 15-minute limit.
timeout = 300
markers = ["py_ci_shared: a gate item generated from [tool.py_ci_shared]"]

[tool.coverage.run]
source = ["py_ci_shared"]
branch = true

[tool.coverage.report]
# fail_under is set from the first full measured run of the ubuntu 3.11 leg (floor of its line+branch total), never guessed.
show_missing = false
skip_covered = true

[tool.black]
line-length = 160
target-version = ["py39", "py310", "py311", "py312", "py313"]
exclude = '''
/(
    \.git
  | \.venv
  | \.pytest_cache
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
extend = "configs/ruff-base.toml"
target-version = "py39"
exclude = [".git", "__pycache__", "build", "dist"]

[tool.ruff.lint.per-file-ignores]
# Every script here IS a CLI tool whose entire job is printing to stdout/stderr -- that's the
# interface, not a lint issue vs. converting to logger calls (there is no log configuration to
# route through; these run standalone or as pre-commit/CI steps).
"src/py_ci_shared/black_filtered_apply.py" = ["T201"]
"src/py_ci_shared/format_warn.py" = ["T201"]
"src/py_ci_shared/bandit_warn.py" = ["T201"]
"src/py_ci_shared/vulture_warn.py" = ["T201"]
"src/py_ci_shared/advisory_warn.py" = ["T201"]
"src/py_ci_shared/install_safe_hook.py" = ["T201"]
"src/py_ci_shared/config_drift_check.py" = ["T201"]
"src/py_ci_shared/setup_env.py" = ["T201"]
"src/py_ci_shared/worktree_hygiene.py" = ["T201"]  # a report CLI: printing the report IS its interface.
"src/py_ci_shared/pinned_tool_versions.py" = ["T201"]
"src/py_ci_shared/sql_verify.py" = ["T201"]
"src/py_ci_shared/teeth_sweep.py" = ["T201"]
"src/py_ci_shared/_mutation_worker.py" = ["T201"]  # a subprocess worker; its stdout IS the protocol its parent reads
"src/py_ci_shared/baseline_ratchet.py" = ["T201"]  # the ratchet's report is what a developer reads when it blocks
# These two print ADVISORY lines on purpose -- findings that are shown but never fail the gate.
"src/py_ci_shared/arb_checks.py" = ["T201"]
"src/py_ci_shared/import_layering.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

# The gates this repo runs on itself: `py-ci-shared run-all` in self-ci, and one pytest item each on a bare `pytest`.
[tool.py_ci_shared]
budget = "warn"
enable = ["repo_hygiene"]

[tool.py_ci_shared.gates.version_consistency]
files = ["src/py_ci_shared/__init__.py"]
modules = ["py_ci_shared"]

[tool.py_ci_shared.gates.pytest_markers]
# These test files hold marker names inside the fixture repos they write, not on their own tests.
exclude = [
    "tests/test_pytest_markers.py",
    "tests/test_docs_inventory_parity.py",
    "tests/test_v113_rules.py",
    "tests/test_marker_runner_coverage.py",
    "tests/test_statement_compilation.py",
    "tests/test_pytest_addopts_path_runs.py",
    "tests/test_resource_leak_guard.py",
]

[tool.py_ci_shared.gates.entry_points_resolvable]
pyproject_path = "pyproject.toml"
min_entries = 5

[tool.py_ci_shared.gates.git_dependency_pins]
pyproject_path = "pyproject.toml"

[tool.py_ci_shared.gates.ci_workflow_paths]
workflows_dir = ".github/workflows"
require_permissions = true
require_sha_pins = true
first_party_owners = ["fingoldo"]

[tool.py_ci_shared.gates.private_imports]
src_dir = "src/py_ci_shared"
package = "py_ci_shared"

[tool.py_ci_shared.gates.naive_utcnow]
root = "src"

[tool.py_ci_shared.gates.identity_comparisons]
files = ["src/**/*.py"]

[tool.py_ci_shared.gates.phantom_markdown_links]
md_files = ["README.md", "WRITING_TESTS.md", "CHANGELOG.md"]

[tool.py_ci_shared.gates.unresolved_imports]
scan_roots = ["src", "tests"]
package_roots = ["src"]
resolvable_prefixes = ["py_ci_shared"]

[tool.py_ci_shared.gates.value_bearing_asserts]
package_root = "src/py_ci_shared"

[tool.py_ci_shared.gates.stale_comment_age]
scan_dirs = ["src", "tests", ".github"]

[tool.py_ci_shared.gates.audit_rounds_format]
module = "audit_round_format"
entry = "assert_rounds_countable"
audits_dir = "audits"

[tool.py_ci_shared.gates.loc_budget]
files = ["src/**/*.py"]
root = "."
baseline_path = "tests/baselines/loc_budget.json"

[tool.py_ci_shared.gates.function_length]
files = ["src/**/*.py"]
root = "."
baseline_path = "tests/baselines/function_length.json"

# uncalled_functions is not enabled: every public assert_*/find_* here is called by consumers, never by this package, so
# it would list the public API itself.

[tool.py_ci_shared.gates.fail_open_handlers]
files = ["src/**/*.py"]
baseline_path = "tests/baselines/fail_open_handlers.json"

[tool.py_ci_shared.gates.fail_message_quality]
meta_dir = "src/py_ci_shared"

[tool.py_ci_shared.gates.workflow_timeouts_black_filtered]
module = "ci_workflow_timeout_gate"
workflow_path = ".github/workflows/black-filtered.yml"

[tool.py_ci_shared.gates.workflow_timeouts_config_drift_check]
module = "ci_workflow_timeout_gate"
workflow_path = ".github/workflows/config-drift-check.yml"

[tool.py_ci_shared.gates.workflow_timeouts_docs]
module = "ci_workflow_timeout_gate"
workflow_path = ".github/workflows/docs.yml"

[tool.py_ci_shared.gates.workflow_timeouts_lint_advisory]
module = "ci_workflow_timeout_gate"
workflow_path = ".github/workflows/lint-advisory.yml"

[tool.py_ci_shared.gates.workflow_timeouts_lint_blocking]
module = "ci_workflow_timeout_gate"
workflow_path = ".github/workflows/lint-blocking.yml"

[tool.py_ci_shared.gates.workflow_timeouts_mypy_beachhead]
module = "ci_workflow_timeout_gate"
workflow_path = ".github/workflows/mypy-beachhead.yml"

[tool.py_ci_shared.gates.workflow_timeouts_mypy_full]
module = "ci_workflow_timeout_gate"
workflow_path = ".github/workflows/mypy-full.yml"

[tool.py_ci_shared.gates.workflow_timeouts_release]
module = "ci_workflow_timeout_gate"
workflow_path = ".github/workflows/release.yml"

[tool.py_ci_shared.gates.workflow_timeouts_ruff_blocking]
module = "ci_workflow_timeout_gate"
workflow_path = ".github/workflows/ruff-blocking.yml"

[tool.py_ci_shared.gates.workflow_timeouts_self_ci]
module = "ci_workflow_timeout_gate"
workflow_path = ".github/workflows/self-ci.yml"
