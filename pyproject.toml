[build-system]
requires = ["setuptools>=78.1.1,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-ci-shared"
version = "0.1.0"
description = "Shared CI/lint tooling (scripts + ruff base config + reusable GitHub Actions workflows) for fingoldo Python projects."
authors = [{name = "Anatoly Alexeev", email = "fingoldo@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
# Deliberately dependency-free for the dev-tool orchestration scripts (black/ruff/mypy/bandit/
# vulture/codespell/pip-audit are installed by the CALLING project's own CI/pre-commit setup, or
# run via `uvx`). orjson is the one exception: code_audit_meta.assert_no_new_code_audit_findings()
# imports it unconditionally at call time (baseline seed/compare/refresh), so every real consumer
# needs it installed -- caught via a live CI failure (ModuleNotFoundError in a caller that didn't
# happen to already depend on orjson itself).
dependencies = ["orjson>=3.9"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    # config_call_site_parity.py's tests build a real pydantic.BaseModel schema fixture (the
    # module itself is duck-typed, no pydantic import at runtime -- only the tests need a
    # concrete model class to exercise it against).
    "pydantic>=2.0",
    # code_audit_meta.py wraps pyutilz.dev.code_audit.run_all() -- exercising it for real (not
    # mocked) needs pyutilz itself. Not on PyPI, so git+https like every consuming repo's own CI.
    # Pinned to a full commit SHA (found unpinned by this repo's own git_dependency_pins check,
    # 2026-07-22 -- the original regex required an '@ref' to even attempt a match, so a bare
    # `git+URL` with no ref at all sailed through undetected).
    "pyutilz @ git+https://github.com/fingoldo/pyutilz.git@3be55c1512ad73a6dab628b4a79eeecbc31212a1",
]

[project.scripts]
safe-precommit = "py_ci_shared.safe_precommit:main"
py-ci-install-safe-hook = "py_ci_shared.install_safe_hook:main"

[project.urls]
Repository = "https://github.com/fingoldo/py-ci-shared"

[tool.setuptools.packages.find]
where = ["src"]

# configs/ruff-base.toml is NOT shipped as package data -- ruff's `extend` needs a real filesystem
# path, so consuming repos resolve it by cloning this repo as a sibling directory (see README.md),
# not via the installed pip package. Only the orchestration scripts (this package's actual purpose)
# are consumed via `pip install`.

[tool.black]
line-length = 160
target-version = ["py39", "py310", "py311", "py312", "py313"]
exclude = '''
/(
    \.git
  | \.venv
  | \.pytest_cache
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
extend = "configs/ruff-base.toml"
target-version = "py39"
exclude = [".git", "__pycache__", "build", "dist"]

[tool.ruff.lint.per-file-ignores]
# Every script here IS a CLI tool whose entire job is printing to stdout/stderr -- that's the
# interface, not a lint issue vs. converting to logger calls (there is no log configuration to
# route through; these run standalone or as pre-commit/CI steps).
"src/py_ci_shared/black_filtered_apply.py" = ["T201"]
"src/py_ci_shared/format_warn.py" = ["T201"]
"src/py_ci_shared/bandit_warn.py" = ["T201"]
"src/py_ci_shared/vulture_warn.py" = ["T201"]
"src/py_ci_shared/advisory_warn.py" = ["T201"]
"src/py_ci_shared/install_safe_hook.py" = ["T201"]
"src/py_ci_shared/config_drift_check.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
