# The repos that consume py-ci-shared, read by .github/workflows/consumer-pins.yml and corpus-drift.yml through
# `python -m py_ci_shared._consumers checkout`. Fields: name, repo (owner/name on GitHub), branch (the one CI runs
# on), private (needs the CONSUMER_READ_TOKEN secret; without it the repo is skipped with a warning), corpus (true:
# also scanned by the nightly corpus-drift job; keep that set small, every scanning gate runs over each).

[[consumer]]
name = "autopsia"
repo = "fingoldo/autopsia"
branch = "master"
private = true

[[consumer]]
name = "mlframe"
repo = "fingoldo/mlframe"
branch = "master"
private = false
corpus = true

[[consumer]]
name = "pyutilz"
repo = "fingoldo/pyutilz"
branch = "master"
private = false
corpus = true

[[consumer]]
name = "social"
repo = "fingoldo/social"
branch = "master"
private = true

[[consumer]]
name = "dash_app_core"
repo = "fingoldo/dash_app_core"
branch = "master"
private = true

[[consumer]]
name = "llm_bench"
repo = "fingoldo/llm_bench"
branch = "main"
private = false
corpus = true

[[consumer]]
