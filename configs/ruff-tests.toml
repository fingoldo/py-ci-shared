# Shared ruff config for TEST directories across fingoldo Python projects (mlframe, pyutilz, ...).
#
# Test suites have a different risk profile than production code: a print() in a test is a
# debugging aid a developer left in deliberately (or added mid-triage) and pytest captures/shows
# it on failure anyway -- it's not the "route diagnostics through logger" problem T20 exists to
# catch in src/. Naming conventions for parametrized scenario classes and vendored-alias imports
# also legitimately diverge from src/ conventions. This file starts from the same base every
# production module uses (correctness rules -- F, real bugs, RUF059 dup-signal, etc. -- all still
# apply in full) and narrows ONLY the handful of rules that are stylistic-not-correctness in a
# test context.
#
# A consuming repo wires this in via a nested config so it applies ONLY under tests/, without
# touching the root pyproject.toml's [tool.ruff] (which stays scoped to src/ and keeps its own
# `exclude = ["tests", ...]`). PY_CI_SHARED_DIR (env-var expansion, see README) means this path
# is the SAME regardless of how deeply nested the config file is -- no "../.." vs "../" bookkeeping:
#
#     # tests/ruff.toml
#     extend = "$PY_CI_SHARED_DIR/configs/ruff-tests.toml"
#     target-version = "py39"          # match the repo's own floor
#
# Ruff's config discovery walks up from each linted file looking for the nearest ruff.toml /
# .ruff.toml / pyproject.toml[tool.ruff] -- tests/ruff.toml wins for anything under tests/ and is
# never merged with the repo-root pyproject.toml automatically; `extend` here is what pulls in
# ruff-base.toml's select/ignore explicitly. Invoke with `ruff check tests/` as its own gate,
# separate from the src/-scoped `ruff check .`.
#
# Same CRITICAL warning as ruff-base.toml: never invoke with `--select <subset>` in a blocking
# gate -- always `--ignore <code>` to add, never `--select` to replace.

extend = "ruff-base.toml"

[lint]
extend-ignore = [
    "T201",  # print(): a debugging/inspection aid deliberately left in a test, not a src/ logging-hygiene issue.
             # pytest captures and shows it on failure -- that IS the point, not something to route through logger.
    "T203",  # pprint(): same rationale as T201, this suite's counterpart for structured debug dumps.
    "E731",  # lambda assigned to a variable: idiomatic in fixtures / @pytest.mark.parametrize argument builders
             # (e.g. `build = lambda seed: _make_frame(seed, n=500)`) where a full `def` adds only noise.
    "N801",  # class name should be CapWords: parametrized-scenario test classes intentionally encode the scenario
             # in the name with underscores for readability (e.g. TestScenarioA_FinancialCross) -- established
             # session-wide convention (see mlframe CLAUDE.md N801 note); never worth a rename churn.
    "N812",  # lowercase module imported as non-lowercase (e.g. `import hermite_fe as H`): short aliases for
             # deeply-nested filter modules keep parametrized test bodies readable; same never-touched convention.
    "DTZ001",  # naive datetime() construction: test fixtures routinely build deliberately-naive timestamps to
               # drive synthetic time-series data (temporal-leak-safety, rolling-window fixtures, etc.) -- the
               # naivety is the fixture's point, not an accidental tz bug the way it would be in src/ scheduling code.
    "DTZ005",  # datetime.now() without tz: same rationale as DTZ001 -- deliberately naive test-fixture timestamps.
    "DTZ011",  # date.today() without tz: same rationale as DTZ001.
    "PERF401", # manual list-comprehension: a straight-line ``for``/``.append()`` loop in a 5-line fixture builder
               # is not a hot path worth the readability trade -- unlike src/, test bodies run once per test, not
               # per production request. Same reasoning extends to PERF402/403/203 below.
    "PERF402", # manual list copy: same rationale as PERF401.
    "PERF403", # manual dict-comprehension: same rationale as PERF401.
    "PERF203", # try/except inside a loop: the per-iteration exception-handling cost this rule guards against is
               # irrelevant at test-fixture scale (tens to thousands of rows, run once), and try/except-per-item is
               # often the clearest way to assert "some items may legitimately fail" inside a test loop.
    "RUF012", # mutable class-level default (e.g. ``items: list = []``): overwhelmingly test-scaffolding config
              # objects and mock classes instantiated once per test, not the shared-mutable-default footgun this
              # rule exists to catch in long-lived src/ classes reused across many instances.
    "RUF043", # pytest.raises(..., match=...) pattern looks regex-ambiguous: the whole point of ``match`` in a test
              # is usually a literal substring of an error message (parens/brackets and all) -- the rule's
              # "did you mean to escape this" heuristic is false-positive-heavy against real assertion text.
    "UP035",  # deprecated typing.Dict/List/Tuple import: same "pure import-source churn, no correctness value"
              # reasoning ruff-base.toml already applies to src/ -- extended here since it fires independently
              # per-scope (tests/ has its own nested config, not inherited from the root ignore).
    "E741",   # ambiguous single-letter variable name (l/I/O): common and locally unambiguous in short synthetic-
              # data / math test bodies (e.g. ``l`` for a loss value, ``I`` for interaction-information) where a
              # fuller name would just repeat the surrounding docstring's own notation.
    "N811",   # constant imported as non-constant / "N814",  # class imported as constant (e.g. ``import X as OLD``
    "N814",   # / ``as NEW`` to alias two versions of the same class for an A/B comparison test): the point of the
    "N815",   # alias IS the semantic role it plays in that specific test, not the ordinary CapWords/UPPER_CASE
    "N817",   # convention for a name that will be imported and used elsewhere -- same never-touched-naming
    "N818",   # convention already established for N801/N812 above. N999 (invalid module name) is the one
              # module-name variant deliberately NOT ignored here: an actually-broken module filename would still
              # break pytest's own test discovery, so it stays a real (if rare) signal.
    "NPY002", # legacy np.random.* over np.random.Generator: added 2026-07-18 alongside ruff-base.toml's NPY
              # selection -- a test fixture seeding `np.random.seed(N)` for reproducible synthetic data is the
              # normal, correct pattern (matches pytest/numpy's own testing conventions), not the accidental-
              # global-state footgun this rule targets in long-lived src/ code. Confirmed on mlframe: ~838 hits,
              # overwhelmingly `np.random.seed`/`.rand`/`.randn` in fixture builders, zero worth migrating.
]

[lint.per-file-ignores]
# conftest.py files commonly re-export fixtures/helpers purely for other test modules to import;
# an "unused" import at the conftest level is often the intended public surface of that fixture module.
"**/conftest.py" = ["F401"]
