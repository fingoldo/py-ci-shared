name: Lint (blocking bundle, reusable)

# Checks that gate the build once a repo's baseline is clean: actionlint (workflow-file
# correctness), codespell (prose typos), yamllint (YAML style), interrogate (docstring coverage,
# threshold-gated), deptry (dependency drift, threshold-gated on a REAL install since its
# DEP001/DEP002 rules are meaningless in a bare environment), bandit (security, medium+
# severity), vulture (dead code, min-confidence 80). Each one here reached 0 findings via an
# explicit, reviewed triage pass (package_module_name_map + per_rule_ignores for deptry,
# per-line noqa / whitelist entries / real fixes for the rest, # nosec for confirmed bandit
# false positives) -- not by relaxing the tool. A repo not yet triaged for a given check should
# leave that input at its default (empty/false) rather than wire it in half-triaged.

on:
  workflow_call:
    inputs:
      source-path:
        description: 'Path to the package source, e.g. "src/mlframe" -- used by bandit/vulture'
        required: true
        type: string
      codespell-paths:
        description: "Space-separated paths for codespell to scan (config/ignore-words-list comes from [tool.codespell] in pyproject.toml)"
        required: true
        type: string
      vulture-whitelist-path:
        description: "Path to the calling repo's own vulture whitelist file (project-specific, never shared)"
        type: string
        default: ""
      interrogate-source-path:
        description: >-
          Path to scan for docstring coverage, e.g. "src/mlframe". Empty string
          skips interrogate entirely (repo not yet at its target coverage).
        type: string
        default: ""
      interrogate-fail-under:
        description: >-
          Minimum docstring-coverage percentage (set to the repo's current actual
          coverage, not a lower aspirational number, so any drop fails fast).
        type: number
        default: 100
      interrogate-config:
        description: >-
          Path to an interrogate config file (e.g. "tests/interrogate.toml") to use instead of the
          calling repo's root pyproject.toml section. Needed when a repo's root [tool.interrogate]
          `exclude` list drops interrogate-source-path's subtree (e.g. "tests") -- passing that
          subtree as the path would then scan 0 items under the root config. Empty string (default)
          auto-discovers pyproject.toml as interrogate normally does; when set, --fail-under above is
          ignored in favor of the config file's own fail-under.
        type: string
        default: ""
      deptry-install-command:
        description: >-
          Shell command(s) to install the package + its real extras, run from repo root, so
          deptry's DEP001/DEP002 rules have an accurate environment to check against. Empty
          string skips deptry entirely (repo not yet triaged for it).
        type: string
        default: ""
      run-zizmor:
        description: >-
          Run zizmor (GitHub Actions workflow security scan) against the calling repo's OWN
          .github/workflows/. False by default: a repo with many pre-existing workflow files
          (matrix CI variants, nightly jobs, etc.) needs its own SHA-pinning/permissions triage
          pass before this can be blocking -- see py-ci-shared's own workflows for the reference
          triage. Flip true only after confirming `uvx zizmor .` is clean in that repo.
        type: boolean
        default: false

jobs:
  lint-blocking:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          enable-cache: true

      # Mirrors the pre-commit actionlint hook so a workflow-file bug (bad expression,
      # duplicate key, unknown runner label, shell-syntax error in a run: block) can't
      # reach master even via --no-verify.
      - name: Actionlint (workflow files)
        run: uvx --from actionlint-py actionlint

      # Security linter for the workflow files themselves (unpinned actions, template-injection
      # via untrusted `${{ }}` expansion in run:, overly broad permissions, credential
      # persistence). Added 2026-07-09 via a CI/CD architecture review; would have caught this
      # exact class of bug earlier (this repo's own workflows needed 23 auto-fixes + manual SHA
      # pinning to reach 0 findings the same day it was added). Opt-in (see run-zizmor above).
      - name: Zizmor (workflow security scan)
        if: inputs.run-zizmor
        run: uvx zizmor .

      - name: Codespell
        # codespell-paths is DELIBERATELY space-separated into multiple positional args (e.g.
        # "src README.md CHANGELOG.md") -- word-splitting is the intended behavior here, not a
        # bug, so this stays unquoted unlike the single-path vars below.
        run: |
          # shellcheck disable=SC2086
          uvx codespell --toml pyproject.toml ${INPUTS_CODESPELL_PATHS}
        env:
          INPUTS_CODESPELL_PATHS: ${{ inputs.codespell-paths }}

      - name: yamllint workflow files
        run: uvx yamllint .github/workflows .pre-commit-config.yaml

      # Plain (not -f json) so a failure's findings are visible directly in the CI log --
      # no artifact download needed to diagnose a blocking failure.
      - name: Bandit security scan
        run: uvx bandit -r "${INPUTS_SOURCE_PATH}" -ll
        env:
          INPUTS_SOURCE_PATH: ${{ inputs.source-path }}

      - name: Vulture dead-code scan
        # vulture-whitelist-path is OPTIONAL (default ""): word-splitting an empty unquoted var
        # makes it vanish from argv entirely, which is the desired "no whitelist arg" behavior --
        # quoting it would instead pass vulture a literal empty-string path argument and error.
        run: |
          # shellcheck disable=SC2086
          uvx vulture "${INPUTS_SOURCE_PATH}" ${INPUTS_VULTURE_WHITELIST_PATH} --min-confidence 80
        env:
          INPUTS_SOURCE_PATH: ${{ inputs.source-path }}
          INPUTS_VULTURE_WHITELIST_PATH: ${{ inputs.vulture-whitelist-path }}

      - name: Interrogate docstring coverage
        if: inputs.interrogate-source-path != ''
        run: |
          if [ -n "$INTERROGATE_CONFIG" ]; then
            uvx interrogate -c "$INTERROGATE_CONFIG" -v "$INTERROGATE_SOURCE_PATH"
          else
            uvx interrogate --fail-under "$INTERROGATE_FAIL_UNDER" -v "$INTERROGATE_SOURCE_PATH"
          fi
        env:
          INTERROGATE_SOURCE_PATH: ${{ inputs.interrogate-source-path }}
          INTERROGATE_FAIL_UNDER: ${{ inputs.interrogate-fail-under }}
          INTERROGATE_CONFIG: ${{ inputs.interrogate-config }}

      # Direct ${{ }} substitution: deptry-install-command is a multi-line shell SCRIPT, not a
      # single token -- expanding it as an unquoted `${VAR}` would word-split it on every
      # whitespace/newline and execute the result as ONE command's argv instead of running each
      # line as its own statement. Only ever set by the calling workflow's own `with:` block
      # (trusted, first-party config), so the injection risk the env-var pattern guards against
      # elsewhere does not apply. See docs.yml for the same fix and the fuller rationale.
      - name: Install project (for deptry)
        if: inputs.deptry-install-command != ''
        shell: bash
        # zizmor: ignore[template-injection] -- see the comment above.
        run: ${{ inputs.deptry-install-command }}

      # `uvx deptry .` (unlike every other uvx step above) is WRONG here: uvx runs deptry in its
      # own isolated tool venv, completely separate from wherever deptry-install-command just
      # installed the project's real dependencies -- deptry would see a bare environment and
      # every DEP001/DEP002/DEP003 rule collapses back to meaningless (found 2026-07-09: this
      # reported 1084 findings on mlframe in CI despite `python -m deptry .` against the same
      # install locally showing 0). deptry must run via `python -m` in the SAME environment
      # deptry-install-command populated, not through uvx's isolation.
      - name: Deptry dependency check
        if: inputs.deptry-install-command != ''
        run: |
          uv pip install --system deptry
          python -m deptry .
