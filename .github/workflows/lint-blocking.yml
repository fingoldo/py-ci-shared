name: Lint (blocking bundle, reusable)

# Checks that gate the build once a repo's baseline is clean: actionlint (workflow-file
# correctness), codespell (prose typos), yamllint (YAML style), interrogate (docstring coverage,
# threshold-gated), deptry (dependency drift, threshold-gated on a REAL install since its
# DEP001/DEP002 rules are meaningless in a bare environment), bandit (security, medium+
# severity), vulture (dead code, min-confidence 80). Each one here reached 0 findings via an
# explicit, reviewed triage pass (package_module_name_map + per_rule_ignores for deptry,
# per-line noqa / whitelist entries / real fixes for the rest, # nosec for confirmed bandit
# false positives) -- not by relaxing the tool. A repo not yet triaged for a given check should
# leave that input at its default (empty/false) rather than wire it in half-triaged.

on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Directory of the project to lint, relative to the repository root (a monorepo subproject, e.g.
          "packages/api"). codespell, bandit, vulture, interrogate and deptry run there, so every path input
          below is relative to it; actionlint, zizmor and yamllint always read the repository's own
          .github/workflows. Default "." (the repository root).
        type: string
        default: "."
      source-path:
        description: 'Path to the package source, e.g. "src/mlframe" -- used by bandit/vulture'
        required: true
        type: string
      codespell-toml:
        description: "The TOML file codespell reads its [tool.codespell] config from, relative to working-directory."
        type: string
        default: "pyproject.toml"
      bandit-config:
        description: 'Config file for bandit (-c), e.g. "pyproject.toml" for a [tool.bandit] table. Empty: bandit defaults.'
        type: string
        default: ""
      bandit-exclude:
        description: 'Comma-separated paths bandit skips (-x), e.g. "tests,scripts". Empty: nothing excluded.'
        type: string
        default: ""
      codespell-paths:
        description: "Space-separated paths for codespell to scan (config/ignore-words-list comes from [tool.codespell] in pyproject.toml)"
        required: true
        type: string
      vulture-whitelist-path:
        description: "Path to the calling repo's own vulture whitelist file (project-specific, never shared)"
        type: string
        default: ""
      interrogate-source-path:
        description: >-
          Path to scan for docstring coverage, e.g. "src/mlframe". Empty string
          skips interrogate entirely (repo not yet at its target coverage).
        type: string
        default: ""
      interrogate-fail-under:
        description: >-
          Minimum docstring-coverage percentage (set to the repo's current actual
          coverage, not a lower aspirational number, so any drop fails fast).
        type: number
        default: 100
      interrogate-config:
        description: >-
          Path to an interrogate config file (e.g. "tests/interrogate.toml") to use instead of the
          calling repo's root pyproject.toml section. Needed when a repo's root [tool.interrogate]
          `exclude` list drops interrogate-source-path's subtree (e.g. "tests") -- passing that
          subtree as the path would then scan 0 items under the root config. Empty string (default)
          auto-discovers pyproject.toml as interrogate normally does; when set, --fail-under above is
          ignored in favor of the config file's own fail-under.
        type: string
        default: ""
      deptry-install-command:
        description: >-
          Shell command(s) to install the package + its real extras, run from working-directory, so
          deptry's DEP001/DEP002 rules have an accurate environment to check against. Empty
          string skips deptry entirely (repo not yet triaged for it).
        type: string
        default: ""
      run-zizmor:
        description: >-
          Run zizmor (GitHub Actions workflow security scan) against the calling repo's OWN
          .github/workflows/. False by default: a repo with many pre-existing workflow files
          (matrix CI variants, nightly jobs, etc.) needs its own SHA-pinning/permissions triage
          pass before this can be blocking -- see py-ci-shared's own workflows for the reference
          triage. Flip true only after confirming `uvx zizmor .` is clean in that repo.
        type: boolean
        default: false
      # Every version input defaults to the pin in tool_versions.py (a test holds them equal); an empty value is refused, never "latest".
      actionlint-version:
        description: 'Exact actionlint-py version to pin (e.g. "1.7.9"), (must not be empty).'
        type: string
        default: "1.7.12.25"
      zizmor-version:
        description: 'Exact zizmor version to pin, (must not be empty).'
        type: string
        default: "1.30.1"
      codespell-version:
        description: 'Exact codespell version to pin, (must not be empty).'
        type: string
        default: "2.4.3"
      yamllint-version:
        description: 'Exact yamllint version to pin, (must not be empty).'
        type: string
        default: "1.38.0"
      bandit-version:
        description: 'Exact bandit version to pin, (must not be empty).'
        type: string
        default: "1.9.4"
      vulture-version:
        description: 'Exact vulture version to pin, (must not be empty).'
        type: string
        default: "2.16"
      interrogate-version:
        description: 'Exact interrogate version to pin, (must not be empty).'
        type: string
        default: "1.7.0"
      deptry-version:
        description: 'Exact deptry version to pin, (must not be empty).'
        type: string
        default: "0.25.1"

permissions:
  contents: read

jobs:
  lint-blocking:
    # Pinned, not ubuntu-latest (which moves to 26.04 from 2026-10-19). Move to ubuntu-26.04 once self-ci's
    # ubuntu-26.04 leg is green; see the comment on that leg for what to verify.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      # An empty *-version input used to mean "newest on PyPI"; the defaults come from tool_versions.py (a test holds them equal), so an
      # explicit empty value is refused instead of running an unreviewed release (audit 2026-11-07 51-F2).
      - name: Require pinned tool versions
        working-directory: .
        env:
          PINS: ${{ inputs.actionlint-version }} ${{ inputs.zizmor-version }} ${{ inputs.codespell-version }} ${{ inputs.yamllint-version }} ${{ inputs.bandit-version }} ${{ inputs.vulture-version }} ${{ inputs.interrogate-version }} ${{ inputs.deptry-version }}
        run: |
          read -r -a pins <<< "$PINS"
          if [ "${#pins[@]}" -ne 8 ]; then
            echo "::error::every lint tool *-version input must be a non-empty exact version (empty would mean unpinned latest)"
            exit 1
          fi

      # A caller that leaves interrogate-source-path or deptry-install-command empty, or run-zizmor false, counts as using this
      # workflow while those tools never run (audit 2026-11-04 34-F10). Say so in the log and the job summary; never fails.
      - name: Report tools skipped by their inputs
        working-directory: .
        env:
          INTERROGATE_PATH: ${{ inputs.interrogate-source-path }}
          DEPTRY_INSTALL: ${{ inputs.deptry-install-command }}
          RUN_ZIZMOR: ${{ inputs.run-zizmor }}
        run: |
          skipped=()
          if [ -z "$INTERROGATE_PATH" ]; then skipped+=("interrogate (interrogate-source-path is empty)"); fi
          if [ -z "$DEPTRY_INSTALL" ]; then skipped+=("deptry (deptry-install-command is empty)"); fi
          if [ "$RUN_ZIZMOR" != "true" ]; then skipped+=("zizmor (run-zizmor is false)"); fi
          for tool in "${skipped[@]}"; do
            echo "::notice title=lint-blocking tool skipped::${tool}: this caller does not run it"
          done
          if [ "${#skipped[@]}" -gt 0 ]; then
            {
              echo "### lint-blocking: tools skipped by this caller's inputs"
              for tool in "${skipped[@]}"; do echo "- ${tool}"; done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Mirrors the pre-commit actionlint hook so a workflow-file bug (bad expression,
      # duplicate key, unknown runner label, shell-syntax error in a run: block) can't
      # reach master even via --no-verify. actionlint-version pins the actionlint-py PACKAGE
      # (--from), not a binary named "actionlint" -- the two are unrelated version strings.
      - name: Actionlint (workflow files)
        working-directory: .
        run: |
          # shellcheck disable=SC2086
          uvx --from "actionlint-py==$PIN" actionlint
        env:
          PIN: ${{ inputs.actionlint-version }}

      # Security linter for the workflow files themselves (unpinned actions, template-injection
      # via untrusted `${{ }}` expansion in run:, overly broad permissions, credential
      # persistence). Added 2026-07-09 via a CI/CD architecture review; would have caught this
      # exact class of bug earlier (this repo's own workflows needed 23 auto-fixes + manual SHA
      # pinning to reach 0 findings the same day it was added). Opt-in (see run-zizmor above).
      - name: Zizmor (workflow security scan)
        if: inputs.run-zizmor
        working-directory: .
        run: |
          uvx "zizmor==$PIN" .
        env:
          PIN: ${{ inputs.zizmor-version }}

      - name: Codespell
        # codespell-paths is DELIBERATELY space-separated into multiple positional args (e.g.
        # "src README.md CHANGELOG.md") -- word-splitting is the intended behavior here, not a
        # bug, so this stays unquoted unlike the single-path vars below.
        run: |
          # shellcheck disable=SC2086
          uvx "codespell==$PIN" --toml "$CODESPELL_TOML" ${INPUTS_CODESPELL_PATHS}
        env:
          INPUTS_CODESPELL_PATHS: ${{ inputs.codespell-paths }}
          CODESPELL_TOML: ${{ inputs.codespell-toml }}
          PIN: ${{ inputs.codespell-version }}

      - name: yamllint workflow files
        working-directory: .
        run: |
          uvx "yamllint==$PIN" .github/workflows .pre-commit-config.yaml
        env:
          PIN: ${{ inputs.yamllint-version }}

      # Plain (not -f json) so a failure's findings are visible directly in the CI log --
      # no artifact download needed to diagnose a blocking failure.
      - name: Bandit security scan
        run: |
          args=(-r "$INPUTS_SOURCE_PATH" -ll)
          if [ -n "$BANDIT_CONFIG" ]; then args+=(-c "$BANDIT_CONFIG"); fi
          if [ -n "$BANDIT_EXCLUDE" ]; then args+=(-x "$BANDIT_EXCLUDE"); fi
          uvx "bandit==$PIN" "${args[@]}"
        env:
          INPUTS_SOURCE_PATH: ${{ inputs.source-path }}
          BANDIT_CONFIG: ${{ inputs.bandit-config }}
          BANDIT_EXCLUDE: ${{ inputs.bandit-exclude }}
          PIN: ${{ inputs.bandit-version }}

      - name: Vulture dead-code scan
        # vulture-whitelist-path is OPTIONAL (default ""): word-splitting an empty unquoted var
        # makes it vanish from argv entirely, which is the desired "no whitelist arg" behavior --
        # quoting it would instead pass vulture a literal empty-string path argument and error.
        run: |
          # shellcheck disable=SC2086
          uvx "vulture==$PIN" "${INPUTS_SOURCE_PATH}" ${INPUTS_VULTURE_WHITELIST_PATH} --min-confidence 80
        env:
          INPUTS_SOURCE_PATH: ${{ inputs.source-path }}
          INPUTS_VULTURE_WHITELIST_PATH: ${{ inputs.vulture-whitelist-path }}
          PIN: ${{ inputs.vulture-version }}

      - name: Interrogate docstring coverage
        if: inputs.interrogate-source-path != ''
        run: |
          INTERROGATE="interrogate==$PIN"
          if [ -n "$INTERROGATE_CONFIG" ]; then
            uvx "$INTERROGATE" -c "$INTERROGATE_CONFIG" -v "$INTERROGATE_SOURCE_PATH"
          else
            uvx "$INTERROGATE" --fail-under "$INTERROGATE_FAIL_UNDER" -v "$INTERROGATE_SOURCE_PATH"
          fi
        env:
          INTERROGATE_SOURCE_PATH: ${{ inputs.interrogate-source-path }}
          INTERROGATE_FAIL_UNDER: ${{ inputs.interrogate-fail-under }}
          PIN: ${{ inputs.interrogate-version }}
          INTERROGATE_CONFIG: ${{ inputs.interrogate-config }}

      # install-command is a multi-line shell SCRIPT: it reaches the step through the environment and runs as `bash -eo pipefail -c "$VAR"` (the quoted
      # variable keeps every line a statement, and nothing from the caller is expanded into the script text).
      - name: Install project (for deptry)
        if: inputs.deptry-install-command != ''
        shell: bash
        env:
          DEPTRY_INSTALL_COMMAND: ${{ inputs.deptry-install-command }}
        run: bash -eo pipefail -c "$DEPTRY_INSTALL_COMMAND"

      # `uvx deptry .` (unlike every other uvx step above) is WRONG here: uvx runs deptry in its
      # own isolated tool venv, completely separate from wherever deptry-install-command just
      # installed the project's real dependencies -- deptry would see a bare environment and
      # every DEP001/DEP002/DEP003 rule collapses back to meaningless (found 2026-07-09: this
      # reported 1084 findings on mlframe in CI despite `python -m deptry .` against the same
      # install locally showing 0). deptry must run via `python -m` in the SAME environment
      # deptry-install-command populated, not through uvx's isolation.
      - name: Deptry dependency check
        if: inputs.deptry-install-command != ''
        env:
          PIN: ${{ inputs.deptry-version }}
        run: |
          uv pip install --system "deptry==$PIN"
          python -m deptry .
