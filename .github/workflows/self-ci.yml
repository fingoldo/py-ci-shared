name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Every other workflow in this repo has this guard (see mlframe/black-filtered.yml's 2026-07-06
# incident comment for why); self-ci.yml was the one exception, found in a CI/CD architecture
# review.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Three OSes since 2026-09-02: this package's checks parse workflow YAML, shell commands and
    # source paths, and several of them do path handling that behaves differently on Windows -
    # a linux-only run could never catch that, while every consumer repo runs the same checks locally.
    # Every Python from the advertised floor (requires-python >=3.9) up, on Linux: the two 3.9/3.10 breakages so far
    # (tomllib, a runtime PEP 604 union) were found by a consumer's shards because this matrix ran 3.11 only.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    # bash on every OS (it ships on the Windows runners too): the run: blocks below use POSIX
    # shell syntax, which pwsh - the Windows default - would parse differently.
    defaults:
      run:
        shell: bash
    steps:
      # Full history and tags: the release-version test compares against the newest tag, and stale_comment_age (run by
      # the dogfood step) needs real blame dates.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      # No fallback to a bare install: without the dev extra the tests that need pydantic, pre-commit, numpy,
      # sqlalchemy or pyutilz would skip and the job would still go green.
      - name: Install package
        run: uv pip install --system -e ".[dev]"

      # The Postgres binaries are on the ubuntu runners but not on PATH; without PG_BIN the real-server tests skip.
      - name: Point PG_BIN at the runner's Postgres
        if: runner.os == 'Linux'
        run: |
          bin=$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$bin" ]; then echo "PG_BIN=$bin" >> "$GITHUB_ENV"; fi

      - name: Smoke-import and run black_filtered_apply --help path
        env:
          BLACK_CMD: "uvx black"
        run: |
          python -c "import py_ci_shared; print('py_ci_shared', py_ci_shared.__version__)"
          python -m py_ci_shared.black_filtered_apply --config pyproject.toml src/py_ci_shared/__init__.py

      # -ra lists every skip with its reason, so a skipped module is visible in the log rather than hidden in a count.
      # Coverage is measured on one leg (ubuntu, 3.11); [tool.coverage.report] holds the floor.
      - name: Run tests
        env:
          COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.11' }}
        run: |
          if [ "$COVERAGE" = "true" ]; then
            python -m pytest tests/ -v -ra --junitxml=junit.xml --cov=py_ci_shared --cov-report=term --cov-report=xml
          else
            python -m pytest tests/ -v -ra --junitxml=junit.xml
          fi

      - name: Skip count
        if: always()
        run: |
          python -c "import xml.etree.ElementTree as E; s = E.parse('junit.xml').getroot().iter('testsuite'); n = sum(int(t.get('skipped', 0)) for t in s); print(f'{n} skipped')" | tee -a "$GITHUB_STEP_SUMMARY"

      # Dogfood: every gate this repo enables in [tool.py_ci_shared] of its own pyproject.toml, run on itself.
      - name: py-ci-shared run-all (self)
        run: py-ci-shared run-all

      # One version, defined in src/py_ci_shared/tool_versions.py -- see ruff-blocking.yml. The
      # pattern tolerates a trailing CR: the Windows leg may check the file out with CRLF endings.
      - name: Resolve ruff version
        run: |
          v=$(sed -n 's/^RUFF_VERSION = "\([0-9][0-9.]*\)".*/\1/p' src/py_ci_shared/tool_versions.py)
          if [ -z "$v" ]; then
            echo "::error::RUFF_VERSION not found in src/py_ci_shared/tool_versions.py"
            exit 1
          fi
          echo "RUFF_VERSION=$v" >> "$GITHUB_ENV"

      - name: Ruff (self-check)
        if: matrix.python == '3.11'
        run: uvx "ruff==${RUFF_VERSION}" check . --ignore C901

      - name: MyPy (self-check)
        if: matrix.python == '3.11'
        # Pinned, not latest: mypy-beachhead.yml's own header comment documents why an unpinned
        # resolve can flag new errors with no corresponding code change, making a gate flaky
        # across re-runs. Keep in sync with the default `mypy-version` used elsewhere in this repo.
        run: |
          uv pip install --system "mypy==2.1.0"
          mypy src/py_ci_shared

      - name: Validate ruff-base.toml is loadable
        if: matrix.python == '3.11'
        run: uvx "ruff==${RUFF_VERSION}" check --config configs/ruff-base.toml --show-settings . 2>&1 | head -5

  # Integration tests: actually CALL the reusable workflows below (same-repo `uses: ./...` ref)
  # against py-ci-shared's own tree, instead of only linting the YAML syntax. Added 2026-07-09
  # (CI/CD architecture review): the `@main`-vs-`@master` ref bug and the lint-advisory.yml
  # sibling-clone bug both shipped without any test ever actually invoking the affected
  # workflow_call path. Extended 2026-07-18 to cover lint-advisory.yml, mypy-full.yml, and the
  # check-path input, closing the exact gap that let those ship undogfooded. lint-blocking.yml
  # and docs.yml remain out: lint-blocking's interrogate step needs py-ci-shared's own src at
  # 100% docstring coverage (currently ~62%) to pass, and docs.yml needs a real mkdocs.yml this
  # repo doesn't have -- not exhaustive coverage of every reusable workflow, but real coverage of
  # the ones that are.
  integration-ruff-blocking:
    uses: ./.github/workflows/ruff-blocking.yml
    with:
      ignore: "C901"

  # Exercises the check-path input (added 2026-07-18 for mlframe's tests/ scoping) against this
  # repo's own tree instead of shipping it unverified against every consumer's real usage --
  # this is exactly the gap the 2026-07-09 architecture review's dogfooding rule exists to close.
  integration-ruff-blocking-check-path:
    uses: ./.github/workflows/ruff-blocking.yml
    with:
      ignore: "C901"
      check-path: "src/py_ci_shared"

  integration-black-filtered:
    uses: ./.github/workflows/black-filtered.yml
    with:
      check-path: "src/py_ci_shared"

  integration-mypy-beachhead:
    uses: ./.github/workflows/mypy-beachhead.yml
    with:
      modules: "src/py_ci_shared/__init__.py"

  # lint-advisory.yml had a real prior incident (2026-07-09, sibling-clone bug) that shipped with
  # zero test ever invoking its workflow_call path -- exactly the failure mode dogfooding exists
  # to prevent. Every step is continue-on-error by design (see the workflow's own header comment),
  # so this job can never fail red; it exists purely to catch a config-load-time break like the
  # one that motivated adding it.
  integration-lint-advisory:
    uses: ./.github/workflows/lint-advisory.yml
    with:
      source-path: "src/py_ci_shared"

  # mypy-full.yml: this repo's OWN src/py_ci_shared is a real, if small, install target -- pip
  # installing the local checkout itself satisfies install-command without needing a synthetic
  # fixture package. advisory:true (backlog not asserted clean here) since this repo has never
  # run a whole-project mypy-full pass before; the point is exercising the workflow_call path,
  # not gating this repo's own mypy backlog (self.MyPy (self-check) above already does that via
  # the beachhead-style direct `mypy src/py_ci_shared` call).
  integration-mypy-full:
    uses: ./.github/workflows/mypy-full.yml
    with:
      package-name: "py_ci_shared"
      install-command: uv pip install --system -e ".[dev]"
      advisory: true
