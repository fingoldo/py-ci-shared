name: Ruff (real bugs - blocking, reusable)

# Reusable blocking gate: the calling repo's FULL configured select/ignore (extended from
# configs/ruff-base.toml via the calling repo's own pyproject.toml `extend`), minus complexity
# (advisory-only, see lint-advisory.yml). Mirrors the calling repo's pre-commit "ruff (real bugs
# block)" hook exactly (same command) so a commit that passes locally cannot fail this and vice versa.
#
# CRITICAL: never change `run:` below to `ruff check . --select ...`. `--select` REPLACES the
# effective rule set instead of narrowing the extended config, silently dropping the whole ignore
# list (ISC001, RUF001/002/003/022, etc. would all reappear) and breaking RUF100's own "is this
# noqa still needed" determination. `--ignore` only ADDS to the already-resolved ignore list, so
# it is safe -- see the calling repos' CLAUDE.md for the incident this rule postdates.

on:
  workflow_call:
    inputs:
      py-ci-shared-ref:
        description: >-
          Ref of py-ci-shared to take configs, RUFF_VERSION and the package from. The default is the release this
          workflow file belongs to (bumped with the version in every release commit), so a caller pinned to a tag or SHA
          gets that release's config rather than master's. A ref that cannot be fetched (after three attempts) fails the
          job: it never falls back to master.
        type: string
        default: "v1.22.4"
      force-remote-fetch:
        description: >-
          Fetch py-ci-shared at py-ci-shared-ref even when the caller is py-ci-shared itself. Only self-ci sets it, to run
          the fetch path every consumer takes.
        type: boolean
        default: false
      ignore:
        description: 'Extra --ignore codes on top of the extended config (e.g. "C901" to keep complexity advisory-only)'
        type: string
        default: "C901"
      check-path:
        description: >-
          Path to check, default "." (whole repo). A calling repo whose pyproject.toml `[tool.ruff]
          exclude` list drops a subtree (e.g. "tests") from the default "." scan, but nests its own
          ruff.toml under that subtree (so it gets its own rule set via ruff's config auto-discovery),
          points this at that subtree to gate it as a SEPARATE job instead of leaving it unchecked.
        type: string
        default: "."

permissions:
  contents: read

jobs:
  ruff-blocking:
    # Pinned, not ubuntu-latest (which moves to 26.04 from 2026-10-19). Move to ubuntu-26.04 once self-ci's
    # ubuntu-26.04 leg is green; see the comment on that leg for what to verify.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      # The calling repo's pyproject.toml does `[tool.ruff] extend = "$PY_CI_SHARED_DIR/configs/ruff-base.toml"`
      # -- ruff expands environment variables in `extend` paths (docs.astral.sh/ruff/settings), so
      # PY_CI_SHARED_DIR just needs to point at ANY real py-ci-shared checkout, not specifically a sibling
      # directory (replaces the former sibling-clone convention, 2026-07-22 -- see README's "Sharing the
      # ruff base config" section for the full rationale).
      # When the calling repo IS py-ci-shared itself (self-ci.yml's own integration-ruff-blocking job),
      # the checkout already IS the repo -- point PY_CI_SHARED_DIR at it instead of cloning a second copy.
      - name: Resolve PY_CI_SHARED_DIR
        # Fetched at inputs.py-ci-shared-ref (this file's own release by default), never at master: a caller pinned to a
        # tag or SHA gets that release's ruff config and RUFF_VERSION, not whatever master holds.
        # The pinned ref or nothing. A fallback to master ran unreviewed config and code under a pinned workflow and
        # stayed green with a warning (audit 2026-10-03 WF-4); a transient failure is retried instead.
        env:
          PCS_REF: ${{ inputs.py-ci-shared-ref }}
          FORCE_REMOTE: ${{ inputs.force-remote-fetch }}
        run: |
          if [ "${GITHUB_REPOSITORY}" = "fingoldo/py-ci-shared" ] && [ "${FORCE_REMOTE}" != "true" ]; then
            echo "PY_CI_SHARED_DIR=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
            exit 0
          fi
          d="${RUNNER_TEMP}/py-ci-shared"
          git init -q "$d"
          for attempt in 1 2 3; do
            if git -C "$d" fetch -q --depth 1 https://github.com/fingoldo/py-ci-shared.git "${PCS_REF}"; then
              git -C "$d" checkout -q FETCH_HEAD
              echo "PY_CI_SHARED_DIR=$d" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::warning::fetching py-ci-shared at ${PCS_REF} failed (attempt ${attempt} of 3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          echo "::error::py-ci-shared ref ${PCS_REF} could not be fetched; fix py-ci-shared-ref (a tag or SHA that exists). There is no fallback to master."
          exit 1

      # Version-pinned (not bare "uvx ruff"): an unpinned uvx resolves whatever is newest on PyPI at
      # run time, drifting from what a contributor's local pre-commit run just verified, the same
      # class of bug black-filtered.yml's BLACK_CMD pin guards against. The version is defined ONCE,
      # in src/py_ci_shared/tool_versions.py of the checkout resolved above; every consumer's
      # pinned-tool-versions hook checks its own pin and its installed ruff against the same value.
      # It used to be a literal repeated in four steps and copied by hand into every consumer, and
      # consumers drifted from it in both directions.
      - name: Resolve ruff version
        run: |
          v=$(sed -n 's/^RUFF_VERSION = "\([0-9][0-9.]*\)".*/\1/p' "${PY_CI_SHARED_DIR}/src/py_ci_shared/tool_versions.py")
          if [ -z "$v" ]; then
            echo "::error::RUFF_VERSION not found in ${PY_CI_SHARED_DIR}/src/py_ci_shared/tool_versions.py"
            exit 1
          fi
          echo "RUFF_VERSION=$v" >> "$GITHUB_ENV"

      # Ruff (0.15.22 when this was written) rejects `--ignore ""` outright ("Unknown rule selector
      # `` in ignore from the CLI") rather than treating an empty string as "no extra codes" - a
      # caller passing `ignore: ""` (meaning "the extended config's own ignores are enough, add
      # nothing") used to crash here. Only append `--ignore` when the caller actually supplied codes.
      - name: Ruff (real bugs - blocking)
        run: |
          if [ -n "${INPUTS_IGNORE}" ]; then
            uvx "ruff==${RUFF_VERSION}" check "${INPUTS_CHECK_PATH}" --ignore "${INPUTS_IGNORE}"
          else
            uvx "ruff==${RUFF_VERSION}" check "${INPUTS_CHECK_PATH}"
          fi
        env:
          INPUTS_IGNORE: ${{ inputs.ignore }}
          INPUTS_CHECK_PATH: ${{ inputs.check-path }}
