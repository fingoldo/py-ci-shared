name: Consumer CI health

# Daily: for every consumer in configs/consumers.toml, read its GitHub Actions runs (read-only, REST API) and report how
# long each workflow has been continuously red. Fails when a workflow is red for more than 2 days; a run GitHub never
# started because of billing (failed payment, spending limit) is reported as `billing` and does not fail the job.
# Public repos are read with this run's GITHUB_TOKEN; private ones need the CONSUMER_READ_TOKEN secret (a fine-grained
# token with actions:read and metadata:read on them); without it they are a RED row and the job fails (--fail-on-skipped-private; a manual run can set allow-skipped-private).

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      allow-skipped-private:
        description: "Do not fail when the CONSUMER_READ_TOKEN secret is absent and private consumers are not checked"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -c .github/constraints/runtime.txt -e .

      - name: CI health report
        env:
          CONSUMER_READ_TOKEN: ${{ secrets.CONSUMER_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ALLOW_SKIPPED_PRIVATE: ${{ inputs.allow-skipped-private }}
        run: |
          if [ -z "$CONSUMER_READ_TOKEN" ]; then
            echo "::warning title=CONSUMER_READ_TOKEN not set::private consumer repos are NOT checked"
          fi
          strict="--fail-on-skipped-private"
          if [ "$ALLOW_SKIPPED_PRIVATE" = "true" ]; then strict=""; fi
          python -m py_ci_shared.ci_health configs/consumers.toml --max-red-days 2 $strict --output ci-health.md

      # This repository's own schedules: corpus-drift was cancelled every night for 10 days and nothing watched it.
      - name: Self-watch report
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m py_ci_shared.ci_health configs/self_watch.toml --max-red-days 2 --output ci-health-self.md

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-health
          path: |
            ci-health.md
            ci-health-self.md
          if-no-files-found: ignore
          retention-days: 30
