name: Corpus drift

# Nightly: run every corpus-bindable find_* of the registered gates over the consumers marked `corpus = true` in
# configs/consumers.toml, and compare the per-finder counts with the snapshot of the last successful run. Fails when
# a count jumps (more than PCT and more than ABSOLUTE), drops to zero from non-zero, or a finder starts to raise.
# The baseline is the artifact of the last SUCCESSFUL run, so a failing night keeps failing until the change is fixed
# or accepted: run it by hand with `accept: true` to make tonight's counts the new baseline.

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      pct:
        description: "Relative growth that, together with absolute, is a jump"
        default: "0.20"
      absolute:
        description: "Absolute growth that, together with pct, is a jump"
        default: "5"
      accept:
        description: "Report the drift but pass, making tonight's counts the next baseline"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  drift:
    # Pinned, not ubuntu-latest (which moves to 26.04 from 2026-10-19). Move to ubuntu-26.04 once self-ci's
    # ubuntu-26.04 leg is green; see the comment on that leg for what to verify.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read  # list this workflow's runs and download the previous snapshot artifact
    env:
      PCT: ${{ inputs.pct || '0.20' }}
      ABSOLUTE: ${{ inputs.absolute || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      # The snapshot imports every registered gate and library module, and resource_leak_guard (a pytest plugin)
      # imports pytest at module level; without it the step died with ModuleNotFoundError. corpus_drift.finders()
      # names any such module (MissingDependencyError); tests/test_corpus_drift.py holds this line to cover them. The sql extra brings sqlglot,
      # which statement_columns_exist_in_ddl needs; without it that finder ERRORED every night.
      - name: Install package
        run: python -m pip install -c .github/constraints/runtime.txt -e ".[sql]" pytest

      - name: Check out the corpus repos
        env:
          CONSUMER_READ_TOKEN: ${{ secrets.CONSUMER_READ_TOKEN }}
        run: |
          python -m py_ci_shared._consumers checkout configs/consumers.toml --corpus-only \
            --dest "$RUNNER_TEMP/corpus" --repos-file "$RUNNER_TEMP/corpus/repos.toml"

      - name: Snapshot tonight's counts
        run: python -m py_ci_shared.corpus_drift snapshot --repos-file "$RUNNER_TEMP/corpus/repos.toml" --output corpus-drift-snapshot.json

      # On master only: a workflow_dispatch with accept: true from another branch must not become master's baseline.
      # The newest such run whose snapshot artifact has not expired (90 days): an expired one failed every night.
      - name: Find the last successful run
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          for candidate in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/corpus-drift.yml/runs?status=success&branch=master&per_page=30" \
            --jq '.workflow_runs[].id'); do
            live=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts?name=corpus-drift-snapshot" \
              --jq '[.artifacts[] | select(.expired == false)] | length')
            if [ "${live:-0}" -gt 0 ]; then
              run_id="$candidate"
              break
            fi
          done
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "previous successful run with a live snapshot: ${run_id:-none}"

      - name: Download its snapshot
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: corpus-drift-snapshot
          path: previous
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Compare
        env:
          ACCEPT: ${{ inputs.accept || false }}
        run: |
          set +e
          python -m py_ci_shared.corpus_drift compare previous/corpus-drift-snapshot.json corpus-drift-snapshot.json \
            --pct "$PCT" --absolute "$ABSOLUTE" --output corpus-drift.md
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$ACCEPT" = "true" ]; then
            echo "::warning title=corpus drift accepted::tonight's counts become the baseline"
            exit 0
          fi
          exit "$status"

      - name: Job summary
        if: always()
        run: |
          if [ -f corpus-drift.md ]; then cat corpus-drift.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: corpus-drift-snapshot
          path: |
            corpus-drift-snapshot.json
            corpus-drift.md
          if-no-files-found: warn
          retention-days: 90
