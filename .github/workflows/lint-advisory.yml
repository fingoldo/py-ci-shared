name: Lint (advisory bundle, reusable)

# Every step here is non-blocking (continue-on-error) because it's inherently a design-taste
# signal rather than a correctness bug (mccabe complexity), or a CVE feed whose fix isn't always
# on your own timeline (pip-audit). Checks that CAN reach a clean 0-findings state after a real
# triage pass (bandit, vulture, codespell, yamllint, interrogate, deptry) live in
# lint-blocking.yml instead once triaged. Real-bug gates also live in ruff-blocking.yml /
# black-filtered.yml / mypy-beachhead.yml.

on:
  workflow_call:
    inputs:
      py-ci-shared-ref:
        description: >-
          Ref of py-ci-shared to take configs, RUFF_VERSION and the package from. The default is the release this
          workflow file belongs to (bumped with the version in every release commit), so a caller pinned to a tag or SHA
          gets that release's config rather than master's. A ref that cannot be fetched (after three attempts) fails the
          job: it never falls back to master.
        type: string
        default: "v1.21.1"
      force-remote-fetch:
        description: >-
          Fetch py-ci-shared at py-ci-shared-ref even when the caller is py-ci-shared itself. Only self-ci sets it, to run
          the fetch path every consumer takes.
        type: boolean
        default: false
      source-path:
        description: 'Path to the package source, e.g. "src/mlframe"'
        required: true
        type: string
      run-import-linter:
        description: >-
          Run `lint-imports` (architectural-boundary contracts from the calling repo's
          [tool.importlinter] in pyproject.toml). False by default: contracts are project-specific
          and most repos won't have any defined yet.
        type: boolean
        default: false
      pydoclint-source-path:
        description: >-
          Path to scan with pydoclint (docstring-vs-signature consistency), e.g. "src/mlframe".
          Empty string (default) skips it entirely.
        type: string
        default: ""
      semgrep-config-path:
        description: >-
          Path to the calling repo's own custom semgrep rules file (e.g. ".semgrep.yml"), for
          org-specific static-analysis rules ruff/bandit don't cover. Empty string (default) skips
          it entirely -- semgrep has no useful default ruleset without a repo-specific config here
          (registry rulesets need a login/network call this workflow doesn't make).
        type: string
        default: ""
      # Exact pins with real defaults: an unpinned install resolves whatever PyPI serves on the day, so the same commit
      # could pass on Monday and fail on Tuesday. A caller overrides a pin through `with:`.
      pip-audit-version:
        type: string
        default: "2.10.1"
      pip-audit-requirements:
        description: >-
          Space-separated requirements files to audit (pip-audit -r each). Empty (the default) audits the calling
          project itself: pip-audit resolves the dependencies its pyproject.toml declares.
        type: string
        default: ""
      pip-audit-uv-lock:
        description: >-
          Audit the exact versions in the calling repo's uv.lock instead of resolving the project. The lock is exported
          (all extras, no hashes, without the project itself) and checked with pip-audit's --no-deps --disable-pip, so no
          environment is built: a dependency that is not on PyPI (a git-sourced package) cannot break the resolution, and
          the audited set is the locked one. Ignored when pip-audit-requirements is set.
        type: boolean
        default: false
      pip-audit-skip-packages:
        description: >-
          Space-separated packages left out of the uv.lock export (git-sourced or private packages pip-audit cannot look
          up on PyPI). Only used with pip-audit-uv-lock.
        type: string
        default: ""
      import-linter-version:
        type: string
        default: "2.15"
      pydoclint-version:
        type: string
        default: "0.9.1"
      semgrep-version:
        type: string
        default: "1.178.0"

permissions:
  contents: read

jobs:
  lint-advisory:
    # Pinned, not ubuntu-latest (which moves to 26.04 from 2026-10-19). Move to ubuntu-26.04 once self-ci's
    # ubuntu-26.04 leg is green; see the comment on that leg for what to verify.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      # Same requirement as ruff-blocking.yml: the calling repo's pyproject.toml does
      # `[tool.ruff] extend = "$PY_CI_SHARED_DIR/configs/ruff-base.toml"`, a real filesystem path
      # ruff resolves with environment-variable expansion (docs.astral.sh/ruff/settings). Missing
      # this step made both ruff steps below fail at config-load time on every run, silently
      # swallowed by continue-on-error -- found 2026-07-09 in a CI/CD architecture review, an
      # unknown amount of time after the reusable-workflow split.
      # When the calling repo IS py-ci-shared itself (self-ci.yml's own integration-lint-advisory
      # job, added 2026-07-18), the checkout already IS the repo -- point PY_CI_SHARED_DIR at it
      # instead of cloning a second copy (a second unconditional clone caused this job's real CI
      # failures 2026-07-18, under the former sibling-clone convention this replaces).
      - name: Resolve PY_CI_SHARED_DIR
        # Fetched at inputs.py-ci-shared-ref (this file's own release by default), never at master: a caller pinned to a
        # tag or SHA gets that release's ruff config and RUFF_VERSION, not whatever master holds.
        # The pinned ref or nothing. A fallback to master ran unreviewed config and code under a pinned workflow and
        # stayed green with a warning (audit 2026-10-03 WF-4); a transient failure is retried instead.
        env:
          PCS_REF: ${{ inputs.py-ci-shared-ref }}
          FORCE_REMOTE: ${{ inputs.force-remote-fetch }}
        run: |
          if [ "${GITHUB_REPOSITORY}" = "fingoldo/py-ci-shared" ] && [ "${FORCE_REMOTE}" != "true" ]; then
            echo "PY_CI_SHARED_DIR=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
            exit 0
          fi
          d="${RUNNER_TEMP}/py-ci-shared"
          git init -q "$d"
          for attempt in 1 2 3; do
            if git -C "$d" fetch -q --depth 1 https://github.com/fingoldo/py-ci-shared.git "${PCS_REF}"; then
              git -C "$d" checkout -q FETCH_HEAD
              echo "PY_CI_SHARED_DIR=$d" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::warning::fetching py-ci-shared at ${PCS_REF} failed (attempt ${attempt} of 3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          echo "::error::py-ci-shared ref ${PCS_REF} could not be fetched; fix py-ci-shared-ref (a tag or SHA that exists). There is no fallback to master."
          exit 1

      # One version, defined in src/py_ci_shared/tool_versions.py -- see ruff-blocking.yml.
      - name: Resolve ruff version
        run: |
          v=$(sed -n 's/^RUFF_VERSION = "\([0-9][0-9.]*\)".*/\1/p' "${PY_CI_SHARED_DIR}/src/py_ci_shared/tool_versions.py")
          if [ -z "$v" ]; then
            echo "::error::RUFF_VERSION not found in ${PY_CI_SHARED_DIR}/src/py_ci_shared/tool_versions.py"
            exit 1
          fi
          echo "RUFF_VERSION=$v" >> "$GITHUB_ENV"

      - name: Run ruff (full - advisory)
        run: uvx "ruff==${RUFF_VERSION}" check "${INPUTS_SOURCE_PATH}"
        continue-on-error: true
        env:
          INPUTS_SOURCE_PATH: ${{ inputs.source-path }}

      - name: Ruff mccabe complexity (advisory)
        run: uvx "ruff==${RUFF_VERSION}" check "${INPUTS_SOURCE_PATH}" --select C90 --statistics
        continue-on-error: true
        env:
          INPUTS_SOURCE_PATH: ${{ inputs.source-path }}

      - name: pip-audit dependency vulnerability scan
        # continue-on-error alone already prevents a non-zero exit from failing the job; the
        # `|| true` was redundant belt-and-suspenders (2026-07-18 architecture review cleanup).
        # It audits the CALLING project: run through uvx with no target, pip-audit audits its own tool venv (28 packages of
        # pip-audit's, never the project), and reported "No known vulnerabilities" for a project pinning
        # requests==2.0.0 (audit 2026-10-03 WF-1). The project directory, or the requirements files, is the target.
        run: |
          targets=()
          flags=()
          for f in ${PIP_AUDIT_REQUIREMENTS}; do targets+=(-r "$f"); done
          if [ "${#targets[@]}" -eq 0 ] && [ "${PIP_AUDIT_UV_LOCK}" = "true" ]; then
            skip=()
            for p in ${PIP_AUDIT_SKIP_PACKAGES}; do skip+=(--no-emit-package "$p"); done
            uv export --frozen --no-hashes --no-emit-project --all-extras "${skip[@]}" -o "${RUNNER_TEMP}/pip-audit-requirements.txt"
            targets=(-r "${RUNNER_TEMP}/pip-audit-requirements.txt")
            flags=(--no-deps --disable-pip)
          fi
          if [ "${#targets[@]}" -eq 0 ]; then targets=(.); fi
          uvx "pip-audit==${PIP_AUDIT_VERSION}" --desc -f json -o pip-audit-report.json "${flags[@]}" "${targets[@]}"
        continue-on-error: true
        env:
          PIP_AUDIT_VERSION: ${{ inputs.pip-audit-version }}
          PIP_AUDIT_REQUIREMENTS: ${{ inputs.pip-audit-requirements }}
          PIP_AUDIT_UV_LOCK: ${{ inputs.pip-audit-uv-lock }}
          PIP_AUDIT_SKIP_PACKAGES: ${{ inputs.pip-audit-skip-packages }}

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 14

      # import-linter's graph builder (grimp) only needs the calling repo's modules to be
      # PARSEABLE, not actually importable with a full dependency install -- PYTHONPATH pointing at
      # the source root is enough (matches the worktree PYTHONPATH trick used for local dev; no
      # need to `pip install -e .` the whole project + its sibling deps just to lint import shape).
      # Assumes the standard `src/<package>` layout `[tool.importlinter] root_packages` implies.
      - name: Import-linter (architectural boundaries, advisory)
        if: inputs.run-import-linter
        run: |
          uv pip install --system "import-linter==${IMPORT_LINTER_VERSION}"
          PYTHONPATH="${GITHUB_WORKSPACE}/src" lint-imports
        continue-on-error: true
        env:
          IMPORT_LINTER_VERSION: ${{ inputs.import-linter-version }}

      - name: pydoclint (docstring-vs-signature consistency, advisory)
        if: inputs.pydoclint-source-path != ''
        run: |
          uv pip install --system "pydoclint==${PYDOCLINT_VERSION}"
          # pydoclint's own pyproject.toml auto-discovery looks for the config file relative to
          # the SCANNED PATH's own directory (findCommonParentFolder of the path args), not the
          # invocation cwd -- so `pydoclint --style=google src/mlframe` never finds a repo-root
          # pyproject.toml at all (confirmed against pydoclint 0.9.1's parse_config.py). A calling
          # repo's [tool.pydoclint] tuning (e.g. disabling checks that clash with a terse-
          # docstring house style) silently never took effect without this. Pass --config
          # explicitly only when the calling repo actually HAS a [tool.pydoclint] section --
          # passing --config unconditionally would make pydoclint's own CLI enforce the section's
          # presence (enforcePydoclintSection=True whenever --config comes from the command line)
          # and hard-error on any repo using this reusable workflow WITHOUT one, turning a
          # currently-fine "run with defaults" repo into a broken advisory job.
          PYPROJECT="${GITHUB_WORKSPACE}/pyproject.toml"
          CONFIG_ARGS=()
          if [ -f "$PYPROJECT" ] && grep -q '^\[tool\.pydoclint\]' "$PYPROJECT"; then
            CONFIG_ARGS=(--config "$PYPROJECT")
          fi
          pydoclint --style=google "${CONFIG_ARGS[@]}" "${INPUTS_PYDOCLINT_SOURCE_PATH}"
        continue-on-error: true
        env:
          INPUTS_PYDOCLINT_SOURCE_PATH: ${{ inputs.pydoclint-source-path }}
          PYDOCLINT_VERSION: ${{ inputs.pydoclint-version }}

      - name: Semgrep (custom org-specific rules, advisory)
        if: inputs.semgrep-config-path != ''
        run: |
          uv pip install --system "semgrep==${SEMGREP_VERSION}"
          semgrep --config "${INPUTS_SEMGREP_CONFIG_PATH}" "${INPUTS_SOURCE_PATH}"
        continue-on-error: true
        env:
          INPUTS_SEMGREP_CONFIG_PATH: ${{ inputs.semgrep-config-path }}
          SEMGREP_VERSION: ${{ inputs.semgrep-version }}
          INPUTS_SOURCE_PATH: ${{ inputs.source-path }}
