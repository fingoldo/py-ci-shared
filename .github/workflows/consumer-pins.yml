name: Consumer pins

# Daily: check out every consumer in configs/consumers.toml read-only and run adoption_matrix over them. Fails when a
# repo's py-ci-shared pins disagree, move, lag the latest release tag by more than 2 releases, or a gate skips itself when the package is
# missing. Private repos need the CONSUMER_READ_TOKEN secret (a fine-grained token with contents:read on them);
# without it the run FAILS (an expired token must not turn into a green run that checks only the public repos); start it by hand with
# allow-skipped-private to run without the secret. A clone that should work and fails is an error.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      allow-skipped-private:
        description: "Do not fail when the CONSUMER_READ_TOKEN secret is absent and private consumers are skipped"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  pins:
    # Pinned, not ubuntu-latest (which moves to 26.04 from 2026-10-19). Move to ubuntu-26.04 once self-ci's
    # ubuntu-26.04 leg is green; see the comment on that leg for what to verify.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Full history and tags: adoption_matrix resolves each pin against them to count releases behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -c .github/constraints/runtime.txt -e .

      - name: Check out the consumers
        env:
          CONSUMER_READ_TOKEN: ${{ secrets.CONSUMER_READ_TOKEN }}
          ALLOW_SKIPPED_PRIVATE: ${{ inputs.allow-skipped-private }}
        run: |
          if [ -z "$CONSUMER_READ_TOKEN" ]; then
            echo "::warning title=CONSUMER_READ_TOKEN not set::private consumer repos are skipped; only the public ones are checked"
          fi
          strict="--fail-on-skipped-private"
          if [ "$ALLOW_SKIPPED_PRIVATE" = "true" ]; then strict=""; fi
          python -m py_ci_shared._consumers checkout configs/consumers.toml $strict \
            --dest "$RUNNER_TEMP/consumers" --repos-file "$RUNNER_TEMP/consumers/repos.toml"

      # --allow-behind 2: a fixed pin may lag the latest release tag by up to 2 releases before the job fails (a consumer
      # bumps on its own schedule). The tolerance needs --resolve-in: "." is this checkout, whose fetch-depth: 0 carries
      # every vX.Y.Z tag the count is made against; without them every pin would read as 0 behind.
      - name: Adoption matrix
        run: |
          # 47-F13: the matrix's exit code is kept, not left to abort the step, so the "Not checked" and SHA sections still reach the summary and artifact on a red run.
          set +e
          python -m py_ci_shared.adoption_matrix --repos-file "$RUNNER_TEMP/consumers/repos.toml" \
            --resolve-in . --allow-behind 2 --waivers configs/pin_waivers.toml --output adoption-matrix.md
          rc=$?
          # 47-F9: a consumer skipped for want of a token is named in the report and the artifact, not only in an annotation.
          python -m py_ci_shared._consumers not-checked "$RUNNER_TEMP/consumers/repos.toml" >> adoption-matrix.md
          # 47-F10: a consumer pinned to a between-release SHA without py-ci-shared-ref runs an older configuration; reported, not failed.
          python -m py_ci_shared.adoption_sha_ref --repos-file "$RUNNER_TEMP/consumers/repos.toml" --resolve-in .
          exit "$rc"

      # 43-F6: a consumer that imports an underscore module or name of py_ci_shared relies on something that "may change in any
      # release". Reported, not failed, until the consumers move to the public names (see the CHANGELOG entry).
      - name: Private py_ci_shared imports of the consumers
        run: |
          python -m py_ci_shared.consumer_import_census --library . --package py_ci_shared --only-private --private-imports report --allow-unparsed --repos-file "$RUNNER_TEMP/consumers/repos.toml"

      - name: Job summary
        if: always()
        run: |
          if [ -f adoption-matrix.md ]; then cat adoption-matrix.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: adoption-matrix
          path: adoption-matrix.md
          if-no-files-found: ignore
          retention-days: 30
