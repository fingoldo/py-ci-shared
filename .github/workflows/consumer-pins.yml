name: Consumer pins

# Daily: check out every consumer in configs/consumers.toml read-only and run adoption_matrix over them. Fails when a
# repo's py-ci-shared pins disagree, move, lag the latest release tag, or a gate skips itself when the package is
# missing. Private repos need the CONSUMER_READ_TOKEN secret (a fine-grained token with contents:read on them);
# without it they are skipped with a warning, while a clone that should work and fails is an error.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history and tags: adoption_matrix resolves each pin against them to count releases behind.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Check out the consumers
        env:
          CONSUMER_READ_TOKEN: ${{ secrets.CONSUMER_READ_TOKEN }}
        run: |
          if [ -z "$CONSUMER_READ_TOKEN" ]; then
            echo "::warning title=CONSUMER_READ_TOKEN not set::private consumer repos are skipped; only the public ones are checked"
          fi
          python -m py_ci_shared._consumers checkout configs/consumers.toml \
            --dest "$RUNNER_TEMP/consumers" --repos-file "$RUNNER_TEMP/consumers/repos.toml"

      - name: Adoption matrix
        run: |
          python -m py_ci_shared.adoption_matrix --repos-file "$RUNNER_TEMP/consumers/repos.toml" \
            --resolve-in . --output adoption-matrix.md

      - name: Job summary
        if: always()
        run: |
          if [ -f adoption-matrix.md ]; then cat adoption-matrix.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: adoption-matrix
          path: adoption-matrix.md
          if-no-files-found: ignore
          retention-days: 30
