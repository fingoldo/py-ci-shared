name: Consumer pins

# Daily: check out every consumer in configs/consumers.toml read-only and run adoption_matrix over them. Fails when a
# repo's py-ci-shared pins disagree, move, lag the latest release tag by more than 2 releases, or a gate skips itself when the package is
# missing. Private repos need the CONSUMER_READ_TOKEN secret (a fine-grained token with contents:read on them);
# without it they are skipped with a warning, while a clone that should work and fails is an error.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  pins:
    # Pinned, not ubuntu-latest (which moves to 26.04 from 2026-10-19). Move to ubuntu-26.04 once self-ci's
    # ubuntu-26.04 leg is green; see the comment on that leg for what to verify.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Full history and tags: adoption_matrix resolves each pin against them to count releases behind.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Check out the consumers
        env:
          CONSUMER_READ_TOKEN: ${{ secrets.CONSUMER_READ_TOKEN }}
        run: |
          if [ -z "$CONSUMER_READ_TOKEN" ]; then
            echo "::warning title=CONSUMER_READ_TOKEN not set::private consumer repos are skipped; only the public ones are checked"
          fi
          python -m py_ci_shared._consumers checkout configs/consumers.toml \
            --dest "$RUNNER_TEMP/consumers" --repos-file "$RUNNER_TEMP/consumers/repos.toml"

      # --allow-behind 2: a fixed pin may lag the latest release tag by up to 2 releases before the job fails (a consumer
      # bumps on its own schedule). The tolerance needs --resolve-in: "." is this checkout, whose fetch-depth: 0 carries
      # every vX.Y.Z tag the count is made against; without them every pin would read as 0 behind.
      - name: Adoption matrix
        run: |
          python -m py_ci_shared.adoption_matrix --repos-file "$RUNNER_TEMP/consumers/repos.toml" \
            --resolve-in . --allow-behind 2 --output adoption-matrix.md

      - name: Job summary
        if: always()
        run: |
          if [ -f adoption-matrix.md ]; then cat adoption-matrix.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the matrix
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: adoption-matrix
          path: adoption-matrix.md
          if-no-files-found: ignore
          retention-days: 30
