name: MyPy-full (whole project, reusable)

# Whole-project mypy, separate from the fast beachhead (mypy-beachhead.yml): installs the real
# dependency graph so mypy has genuine type info instead of collapsing every import to Any.
#
# `advisory` (default true = continue-on-error) is a PER-REPO choice, not hardcoded here: a repo
# that has already closed its whole-project mypy backlog to 0 (mlframe, as of 2026-07-08) should
# pass `advisory: false` to make this a real blocking regression gate; a repo still working down
# a backlog (pyutilz) keeps the default `true`. Never silently downgrade an already-clean repo's
# gate from blocking to advisory by copying the wrong default.

on:
  workflow_call:
    inputs:
      package-name:
        description: 'Import name of the package, e.g. "mlframe" (checks src/<package-name> unless package-path overrides it)'
        required: true
        type: string
      package-path:
        description: >-
          Path to the package directory, relative to repo root, when it is NOT under src/<package-name>
          (e.g. a repo with the package at its own root, like autopsia's "autopsia/"). Defaults to
          "src/<package-name>" so every existing caller (mlframe, pyutilz) is unaffected.
        type: string
        default: ""
      install-command:
        description: "Shell command(s) to install the package + its extras, run from repo root"
        required: true
        type: string
      mypy-version:
        type: string
        default: "2.1.0"
      advisory:
        description: "true = continue-on-error (backlog not yet clean); false = blocking (backlog already closed to 0)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  mypy-full:
    # Pinned, not ubuntu-latest (which moves to 26.04 from 2026-10-19). Move to ubuntu-26.04 once self-ci's
    # ubuntu-26.04 leg is green; see the comment on that leg for what to verify.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # install-command is a multi-line shell SCRIPT: it reaches the step through the environment and runs as `bash -eo pipefail -c "$VAR"` (the quoted
      # variable keeps every line a statement, and nothing from the caller is expanded into the script text).
      - name: Install project
        shell: bash
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        # Through the environment, not expanded into the script; `-eo pipefail` keeps the stop-at-first-failure of a multi-line command.
        run: bash -eo pipefail -c "$INSTALL_COMMAND"

      - name: Install mypy
        run: uv pip install --system "mypy==${INPUTS_MYPY_VERSION}"
        env:
          INPUTS_MYPY_VERSION: ${{ inputs.mypy-version }}

      - name: MyPy (whole project)
        run: mypy "${INPUTS_PACKAGE_PATH:-src/$INPUTS_PACKAGE_NAME}"
        continue-on-error: ${{ inputs.advisory }}
        env:
          INPUTS_PACKAGE_NAME: ${{ inputs.package-name }}
          INPUTS_PACKAGE_PATH: ${{ inputs.package-path }}
