name: docs (reusable)

# MkDocs build on every PR; deploy to GitHub Pages on push to the default branch, opt-in via the
# calling repo's own `PUBLISH_DOCS` repository variable (kept unset/false until the site is ready).

on:
  workflow_call:
    inputs:
      install-command:
        description: "Shell command(s) to install the package + docs deps, run from repo root"
        required: true
        type: string
      default-branch:
        type: string
        default: "master"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      # Direct ${{ }} substitution (not the env-var-then-shell-expand pattern used elsewhere in
      # this repo): install-command is a multi-line shell SCRIPT, not a single token. Expanding
      # it as an unquoted `${VAR}` would word-split it on every whitespace/newline and execute
      # the result as ONE command's argv instead of running each line as its own statement; a
      # generic zizmor auto-fix made exactly this mistake here, caught by actionlint's shellcheck
      # (SC2086) immediately after. install-command is also only ever set by the calling
      # workflow's own `with:` block (trusted, first-party config), not by any external/
      # attacker-controlled GitHub context -- the injection risk the env-var pattern guards
      # against elsewhere does not apply to this input.
      - name: Install project + docs deps
        shell: bash
        # zizmor: ignore[template-injection] -- see the comment above.
        run: ${{ inputs.install-command }}

      - name: Build site
        run: mkdocs build --site-dir site

      - name: Upload Pages artifact
        if: github.ref == format('refs/heads/{0}', inputs.default-branch) && vars.PUBLISH_DOCS == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

  deploy:
    if: github.ref == format('refs/heads/{0}', inputs.default-branch) && vars.PUBLISH_DOCS == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
