name: docs (reusable)

# MkDocs build on every PR; deploy to GitHub Pages on push to the default branch, opt-in via the
# calling repo's own `PUBLISH_DOCS` repository variable (kept unset/false until the site is ready).

on:
  workflow_call:
    inputs:
      install-command:
        description: "Shell command(s) to install the package + docs deps, run from repo root"
        required: true
        type: string
      default-branch:
        type: string
        default: "master"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project + docs deps
        shell: bash
        run: ${{ inputs.install-command }}

      - name: Build site
        run: mkdocs build --site-dir site

      - name: Upload Pages artifact
        if: github.ref == format('refs/heads/{0}', inputs.default-branch) && vars.PUBLISH_DOCS == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == format('refs/heads/{0}', inputs.default-branch) && vars.PUBLISH_DOCS == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
