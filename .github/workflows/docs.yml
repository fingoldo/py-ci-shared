name: docs (reusable)

# MkDocs build on every PR; deploy to GitHub Pages on push to the default branch, opt-in via the
# calling repo's own `PUBLISH_DOCS` repository variable (kept unset/false until the site is ready).

on:
  workflow_call:
    inputs:
      install-command:
        description: "Shell command(s) to install the package + docs deps, run from repo root"
        required: true
        type: string
      default-branch:
        type: string
        default: "master"

permissions:
  contents: read

jobs:
  build:
    # Pinned, not ubuntu-latest (which moves to 26.04 from 2026-10-19). Move to ubuntu-26.04 once self-ci's
    # ubuntu-26.04 leg is green; see the comment on that leg for what to verify.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      # install-command is a multi-line shell SCRIPT: it reaches the step through the environment and runs as `bash -eo pipefail -c "$VAR"` (the quoted
      # variable keeps every line a statement, and nothing from the caller is expanded into the script text).
      - name: Install project + docs deps
        shell: bash
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        # Through the environment, not expanded into the script; `-eo pipefail` is what GitHub's own bash shell line adds, so a multi-line command stops at its first failure.
        run: bash -eo pipefail -c "$INSTALL_COMMAND"

      - name: Build site
        run: mkdocs build --site-dir site

      - name: Upload Pages artifact
        if: github.ref == format('refs/heads/{0}', inputs.default-branch) && vars.PUBLISH_DOCS == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    if: github.ref == format('refs/heads/{0}', inputs.default-branch) && vars.PUBLISH_DOCS == 'true'
    needs: build
    # Pinned, not ubuntu-latest (which moves to 26.04 from 2026-10-19). Move to ubuntu-26.04 once self-ci's
    # ubuntu-26.04 leg is green; see the comment on that leg for what to verify.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
