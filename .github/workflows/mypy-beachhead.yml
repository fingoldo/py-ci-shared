name: MyPy (strict-mode beachhead, reusable)

# Fast strict-mode check over a small, cohesive, stable-surface module list -- NOT the whole
# project (see mypy-full.yml for that). --follow-imports=silent because the uvx sandbox lacks
# the calling project's heavy transitive deps; the explicit module list IS the beachhead.
# Dep pins are exact (not ranges): an unpinned resolve can pick up a newer release that flags
# errors the pinned version does not, making the gate flaky across re-runs.
#
# This workflow's uvx isolation (mypy running in its own sandbox, never seeing the real
# project's dependency graph) is DELIBERATE and safe -- not the same class of bug as
# lint-blocking.yml's deptry step, which used uvx BY ACCIDENT and got a bare/wrong environment
# as a result. Don't "fix" this by installing the real deps first and switching to `python -m
# mypy`: that would defeat the beachhead's whole reason to exist (a fast, isolated check that
# doesn't pay the real dependency-install cost) and reintroduce exactly the class of drift the
# deptry incident was about, just in reverse.

on:
  workflow_call:
    inputs:
      modules:
        description: "Newline-separated list of files/dirs for the strict-mode beachhead"
        required: true
        type: string
      mypy-version:
        type: string
        default: "2.1.0"
      extra-deps:
        description: 'Newline-separated exact pins for the isolated uvx sandbox (e.g. "numpy==2.3.5")'
        type: string
        default: ""

jobs:
  mypy-beachhead:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          enable-cache: true

      - name: MyPy (strict-mode beachhead)
        shell: bash
        env:
          MODULES_IN: ${{ inputs.modules }}
          DEPS_IN: ${{ inputs.extra-deps }}
          INPUTS_MYPY_VERSION: ${{ inputs.mypy-version }}
        run: |
          with_args=()
          while IFS= read -r dep; do
            [ -z "$dep" ] && continue
            with_args+=("--with" "$dep")
          done <<< "$DEPS_IN"
          modules=()
          while IFS= read -r mod; do
            [ -z "$mod" ] && continue
            modules+=("$mod")
          done <<< "$MODULES_IN"
          uvx "${with_args[@]}" "mypy==${INPUTS_MYPY_VERSION}" --follow-imports=silent "${modules[@]}"
