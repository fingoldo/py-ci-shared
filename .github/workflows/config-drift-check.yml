name: Config drift check (consumers)

# Scheduled, informational-only report of [tool.ruff]/[tool.mypy] divergence across consumer
# repos (mlframe, pyutilz) -- the automated follow-up README.md's "Keeping this repo in sync
# with consumers" section names as not yet existing (2026-07-18). Never fails the run: legitimate
# per-repo divergence exists (a repo mid-migration to a new rule), so this posts a step summary
# for a human to review rather than gating anything.

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  config-drift-check:
    # Pinned, not ubuntu-latest (which moves to 26.04 from 2026-10-19). Move to ubuntu-26.04 once self-ci's
    # ubuntu-26.04 leg is green; see the comment on that leg for what to verify.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      # Nothing installed the package, so every run printed "No module named 'py_ci_shared'" and went green: the
      # default `bash -e` shell takes the exit status of `tee`. `shell: bash` adds pipefail; the check itself
      # always exits 0 on divergence, so only a crash fails the run.
      - name: Install package
        run: python -m pip install -c .github/constraints/runtime.txt -e .

      - name: Run config drift check
        shell: bash
        run: python -m py_ci_shared.config_drift_check | tee -a "$GITHUB_STEP_SUMMARY"
