name: Config drift check (consumers)

# Scheduled, informational-only report of [tool.ruff]/[tool.mypy] divergence across consumer
# repos (mlframe, pyutilz) -- the automated follow-up README.md's "Keeping this repo in sync
# with consumers" section names as not yet existing (2026-07-18). Never fails the run: legitimate
# per-repo divergence exists (a repo mid-migration to a new rule), so this posts a step summary
# for a human to review rather than gating anything.

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Run config drift check
        run: python -m py_ci_shared.config_drift_check | tee -a "$GITHUB_STEP_SUMMARY"
