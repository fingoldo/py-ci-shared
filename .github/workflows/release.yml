name: Release

# Pushing a vX.Y.Z tag: check the tag is the version the package declares and sits on master, run the release checks,
# then move the major tag (v1) to it and publish the GitHub release. Consumers on @v1 get the release from that moment;
# nobody re-points v1 by hand any more.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Install package
        run: uv pip install --system -e ".[dev]"

      - name: Tag equals the declared version and is on master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          declared="v$(python -c 'import py_ci_shared; print(py_ci_shared.__version__)')"
          if [ "$TAG" != "$declared" ]; then
            echo "::error::tag $TAG but the package declares $declared; bump pyproject.toml and __init__.py, then re-tag"
            exit 1
          fi
          git fetch -q origin master
          if ! git merge-base --is-ancestor "$TAG" origin/master; then
            echo "::error::$TAG is not on master; tag a commit that is"
            exit 1
          fi
          python -c "from pathlib import Path; from py_ci_shared.version_tag_currency import find_version_tag_problems as f; p = f(Path('.'), 'pyproject.toml'); print(*p, sep='\n'); raise SystemExit(1 if p else 0)"

      - name: Release checks
        run: python -m pytest tests/test_release_version.py tests/test_package_inventory.py tests/test_reusable_workflows.py -ra

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          # The major tag points at commits that change .github/workflows, and GITHUB_TOKEN may never update such a
          # ref (it has no `workflows` permission). RELEASE_TOKEN is a fine-grained token with contents and workflows
          # write on this repository.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"

      - name: Move the major tag
        env:
          TAG: ${{ github.ref_name }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
            echo "::error::RELEASE_TOKEN is not set, so the major tag cannot be moved (GITHUB_TOKEN may not update a ref to a commit that changes workflows). Add the secret, or move it by hand: git tag -f ${TAG%%.*} $TAG^{commit} && git push -f origin refs/tags/${TAG%%.*}"
            exit 1
          fi
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"
