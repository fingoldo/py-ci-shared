name: Release

# Pushing a vX.Y.Z tag: verify that the tag is the version the package declares, sits on master, is the newest release
# of its major, and that self-ci succeeded for the tagged commit; run the whole test suite; then move the major tag (v1)
# to it and create the GitHub release. Consumers on @v1 get the release from that moment; nobody re-points v1 by hand.
# Every publish step is idempotent (the tag move is skipped when v1 is already there, the release is created only when
# missing), so "Re-run failed jobs" finishes a half-done release.
#
# workflow_dispatch with `rollback-to: vX.Y.Z` is the emergency path: it points the major tag back at an earlier
# release that already shipped. See CLAUDE.md "Rolling back a release" for when to use it.
#
# The tag-selection, CI and version rules are in .github/scripts/release_guard.py, tested by
# tests/test_release_version.py against a scratch git repository.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      rollback-to:
        description: "Emergency rollback: an existing vX.Y.Z release to point its major tag (v1) at"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push'
    # Pinned, not ubuntu-latest (which moves to 26.04 from 2026-10-19). Move to ubuntu-26.04 once self-ci's
    # ubuntu-26.04 leg is green; see the comment on that leg for what to verify.
    runs-on: ubuntu-24.04
    # Up to 30 minutes waiting for self-ci of the tagged commit, then the whole suite.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read  # self-ci's runs for the tagged commit
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      # No cache on the release path: a cache restored here could have been written by any earlier run, and what this
      # job verifies becomes the v1 every consumer fetches (zizmor cache-poisoning).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false

      # The runtime dependencies are constrained to exact versions; the [dev] test tools resolve as in self-ci, whose
      # green run for this very commit is required below.
      - name: Install package
        run: uv pip install --system -c .github/constraints/runtime.txt -e ".[dev]"

      - name: Tag equals the declared version and is on master
        env:
          TAG: ${{ github.ref_name }}
        run: |
          declared="v$(python -c 'import py_ci_shared; print(py_ci_shared.__version__)')"
          if [ "$TAG" != "$declared" ]; then
            echo "::error::tag $TAG but the package declares $declared; bump pyproject.toml and __init__.py, then re-tag"
            exit 1
          fi
          git fetch -q origin master
          if ! git merge-base --is-ancestor "$TAG" origin/master; then
            echo "::error::$TAG is not on master; tag a commit that is"
            exit 1
          fi
          python -c "from pathlib import Path; from py_ci_shared.version_tag_currency import find_version_tag_problems as f; p = f(Path('.'), 'pyproject.toml'); print(*p, sep='\n'); raise SystemExit(1 if p else 0)"

      # A back-port tag (v1.17.1 after v1.19.0) must not move v1 backwards for every consumer.
      - name: The tag is the newest release of its major
        env:
          TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_guard.py major-move "$TAG"

      - name: self-ci succeeded for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: python .github/scripts/release_guard.py ci-green --repo "$GITHUB_REPOSITORY" --sha "$SHA" --wait 1800

      # The Postgres binaries are on the runner but not on PATH; without PG_BIN the real-server tests skip.
      - name: Point PG_BIN at the runner's Postgres
        run: |
          bin=$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$bin" ]; then echo "PG_BIN=$bin" >> "$GITHUB_ENV"; fi

      # The whole suite, not a subset: self-ci covered every OS and Python for this commit, this run re-checks the
      # exact tree being published with the release-path install.
      - name: Run the test suite
        run: python -m pytest tests/ -ra

  publish:
    needs: verify
    if: github.event_name == 'push'
    # Pinned, not ubuntu-latest (which moves to 26.04 from 2026-10-19). Move to ubuntu-26.04 once self-ci's
    # ubuntu-26.04 leg is green; see the comment on that leg for what to verify.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment is created on first use. Its protection (a deployment rule for v* tags) and moving RELEASE_TOKEN
    # from the repository secrets into it are repository settings the owner sets (see CLAUDE.md).
    environment: release
    permissions:
      contents: write  # push the major tag, create the GitHub release
    steps:
      # The persisted credential is what the tag push below uses; this job uploads no artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1  # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          # The major tag points at commits that change .github/workflows, and GITHUB_TOKEN may never update such a
          # ref (it has no `workflows` permission). RELEASE_TOKEN is a fine-grained token with contents and workflows
          # write on this repository.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      # Checked again: another tag may have been pushed since verify started.
      - name: Still the newest release of its major
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release_guard.py major-move "$TAG"

      # Before the release page: a failure here leaves no "Latest" release claiming what @v1 does not yet run.
      - name: Move the major tag
        env:
          TAG: ${{ github.ref_name }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          major="${TAG%%.*}"
          target=$(git rev-parse "$TAG^{commit}")
          if [ "$(git rev-parse -q --verify "refs/tags/$major^{commit}" || true)" = "$target" ]; then
            echo "$major already points at $TAG ($target)"
            exit 0
          fi
          if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
            echo "::error::RELEASE_TOKEN is not set, so the major tag cannot be moved (GITHUB_TOKEN may not update a ref to a commit that changes workflows). Add the secret, then re-run this job."
            exit 1
          fi
          git tag -f "$major" "$target"
          git push -f origin "refs/tags/$major"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi

  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write  # push the major tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1  # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: The target is a release that shipped
        env:
          TARGET: ${{ inputs.rollback-to }}
        run: python3 .github/scripts/release_guard.py rollback "$TARGET"

      - name: Point the major tag at it
        env:
          TARGET: ${{ inputs.rollback-to }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          if [ "$HAS_RELEASE_TOKEN" != "true" ]; then
            echo "::error::RELEASE_TOKEN is not set, so the major tag cannot be moved"
            exit 1
          fi
          major="${TARGET%%.*}"
          target=$(git rev-parse "$TARGET^{commit}")
          git tag -f "$major" "$target"
          git push -f origin "refs/tags/$major"
          echo "::warning title=rolled back::$major now points at $TARGET ($target). Fix forward with a new, higher release."
