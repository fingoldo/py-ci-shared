name: Black (filtered, reusable)

# Flags any Black finding EXCEPT blank-line insertion and arg/import-list explosion, which
# consuming projects deliberately keep -- see py_ci_shared/black_filtered_apply.py's docstring
# for the excluded-class rationale.

on:
  workflow_call:
    inputs:
      check-path:
        description: 'Path(s) to check, e.g. "src/mlframe" or "."'
        required: true
        type: string

jobs:
  black:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Install py-ci-shared
        # Derives the ref from github.workflow_ref (format "owner/repo/.github/workflows/FILE@REF")
        # instead of a hardcoded tag: a hardcoded literal here silently decouples from whichever
        # tag/SHA a consumer's `uses:` line actually resolved to -- a future fix to
        # black_filtered_apply.py's diff-classification logic could ship a new tag that consumers
        # bump to, yet this install step would keep installing the OLD package version forever
        # until someone remembers to also edit this line by hand (found 2026-07-18 architecture
        # review: this literal had already drifted to v1.0.0 while newer workflow versions existed).
        run: |
          PCS_REF="${GITHUB_WORKFLOW_REF#*@}"
          uv pip install --system "py-ci-shared @ git+https://github.com/fingoldo/py-ci-shared.git@${PCS_REF}"

      # check-path can be multiple space-separated paths (per its "Path(s)" description) --
      # word-splitting is the intended behavior here, not a bug.
      #
      # BLACK_CMD is version-pinned (not bare "uvx black"): unpinned resolves whatever's newest
      # on PyPI at run time, which drifts both across CI runs over time AND against whatever
      # version a contributor has installed locally -- observed 2026-07-12, a commit that
      # verified 0 findings locally against black 26.5.1 still failed this CI job because uvx
      # had resolved a different version. Consuming repos should pin the same version in their
      # own [project.optional-dependencies] `black==...` pin so local and CI always agree.
      - name: Black format check, filtered
        env:
          BLACK_CMD: "uvx black==26.5.1"
          INPUTS_CHECK_PATH: ${{ inputs.check-path }}
        run: |
          # shellcheck disable=SC2086
          python -m py_ci_shared.black_filtered_apply --config pyproject.toml --check ${INPUTS_CHECK_PATH}
