version: 2
updates:
  # Every SHA-pinned `uses:` in the reusable workflows needs an update channel, or a pin never moves off a retired action
  # runtime. Grouped so the whole ecosystem costs one PR (and one CI run) per week.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  # The constraints that the reusable workflows and the scheduled reports install under `-c` (runtime.txt, dev.txt) are exact pins.
  # Without an update channel a pin stays on the version that was current the day it was written, and every consumer shares the lag.
  - package-ecosystem: pip
    directory: "/.github/constraints"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      constraints:
        patterns:
          - "*"
    cooldown:
      default-days: 7
